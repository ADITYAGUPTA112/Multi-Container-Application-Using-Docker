services:
  prometheus:
    image: prom/prometheus:latest
    container_name: todo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api
    networks:
      - todo_network

  grafana:
    image: grafana/grafana:latest
    container_name: todo-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - todo_network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: todo-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - todo_network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: todo-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - todo_network

  mongo-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: todo-mongo-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    command: --mongodb.uri=mongodb://mongodb:27017
    networks:
      - todo_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: todo-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - todo_network

networks:
  todo_network:
    external: true
