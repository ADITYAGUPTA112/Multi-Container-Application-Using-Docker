[webservers]
# Replace with the output IPv4 address from `terraform output server_public_ip`
production-server ansible_host=YOUR_SERVER_IP_HERE ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
app_dir=/opt/todo-app
docker_image_name=todo-api:latest
