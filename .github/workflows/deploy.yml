name: CD Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build & Push Docker Hub Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/todo-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Deploy to Remote Cloud Server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'deployer' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "[Deploy] Navigating to application directory..."
            cd /opt/todo-app

            echo "[Deploy] Pulling latest production images..."
            docker compose -f docker-compose.prod.yml pull api || docker compose pull api

            echo "[Deploy] Restarting container services with zero-downtime..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "[Deploy] Validating system health..."
            sleep 5
            curl -f http://localhost/health || exit 1

            echo "[Deploy] Deployment successfully completed!"
