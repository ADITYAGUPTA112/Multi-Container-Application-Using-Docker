services:
  reverse-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: todo-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - todo_network_prod

  api:
    image: aditya5005/todo-api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: todo-api-prod
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/todos_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_production}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - CLIENT_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todo_network_prod

  mongodb:
    image: mongo:7.0
    container_name: todo-mongodb-prod
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongodb_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - todo_network_prod

  redis:
    image: redis:7-alpine
    container_name: todo-redis-prod
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - todo_network_prod

  mongo-backup:
    image: mongo:7.0
    container_name: todo-mongo-backup
    restart: "no"
    volumes:
      - ./scripts:/scripts
      - mongo_backups:/backups
    entrypoint: /bin/bash
    command: -c "chmod +x /scripts/backup-mongo.sh && crond -f"
    depends_on:
      - mongodb
    networks:
      - todo_network_prod

networks:
  todo_network_prod:
    name: todo_network_prod
    driver: bridge

volumes:
  mongodb_data_prod:
    name: mongodb_data_prod
  redis_data_prod:
    name: redis_data_prod
  mongo_backups:
    name: mongo_backups
