services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: todo-api-dev
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/todos_db
      - CLIENT_ORIGIN=*
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - todo_network

  mongodb:
    image: mongo:7.0
    container_name: todo-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - todo_network

networks:
  todo_network:
    name: todo_network_dev
    driver: bridge

volumes:
  mongodb_data_dev:
    name: mongodb_data_dev
