<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Container Cloud Platform | Todo Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-branding">
        <div class="logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <div>
          <h1>Multi-Container Todo Platform</h1>
          <p class="subtitle">Docker Compose · Node.js · MongoDB · Nginx · Terraform</p>
        </div>
      </div>
      
      <!-- System Health Indicator -->
      <div id="systemHealth" class="health-pill checking">
        <span class="health-dot"></span>
        <span id="healthText" class="health-text">Checking Cluster...</span>
      </div>
    </header>

    <!-- Stats Bar -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Tasks</span>
        <span id="statTotal" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span id="statPending" class="stat-value text-amber">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Completed</span>
        <span id="statCompleted" class="stat-value text-emerald">0</span>
      </div>
    </section>

    <!-- Create Task Form -->
    <section class="card create-card">
      <h2>Create New Task</h2>
      <form id="todoForm" class="todo-form">
        <div class="form-group">
          <input 
            type="text" 
            id="todoTitle" 
            placeholder="What needs to be done? (e.g., Deploy with Ansible)" 
            maxlength="200" 
            required 
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <textarea 
            id="todoDescription" 
            placeholder="Optional task details or notes..." 
            rows="2" 
            maxlength="2000"
          ></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Task</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Filter Tabs & List Header -->
    <section class="list-section">
      <div class="list-header">
        <h2>Tasks</h2>
        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">All</button>
          <button class="tab-btn" data-filter="active">Active</button>
          <button class="tab-btn" data-filter="completed">Completed</button>
        </div>
      </div>

      <!-- Todo List Container -->
      <div id="todoList" class="todo-list">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Connecting to Docker containers...</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Notification Toast -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
