apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  namespace: todo-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_ORIGIN: "*"
  REDIS_URL: "redis://redis-service:6379"
  MONGO_URI: "mongodb://mongodb-service:27017/todos_db"
  JWT_ACCESS_EXPIRY: "15m"
  JWT_REFRESH_EXPIRY: "7d"
---
apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  namespace: todo-platform
type: Opaque
stringData:
  JWT_SECRET: "k8s_super_secure_jwt_token_secret_key_2026"
  JWT_REFRESH_SECRET: "k8s_super_secure_refresh_token_secret_key_2026"
