services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: todo-api
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/todos_db
      - CLIENT_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - todo_network

  mongodb:
    image: mongo:7.0
    container_name: todo-mongodb
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - todo_network

networks:
  todo_network:
    name: todo_network
    driver: bridge

volumes:
  mongodb_data:
    name: mongodb_data
